[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openmot-serve"
version = "0.1.0"
description = "Multi-object tracking (MOT17/MOT20) as a production service, evaluated with HOTA."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch==2.7.1",
  "torchvision==0.22.1",
  "numpy",
  "scipy",
  "opencv-python-headless",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
service = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "celery>=5.4",
  "redis>=5",
]

[tool.setuptools.packages.find]
include = ["tracking*", "eval*", "app*", "worker*"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not gpu and not data and not integration'"
markers = [
  "gpu: needs a CUDA GPU (run with -m gpu)",
  "data: needs the MOT17 dataset under data/MOT17 (run with -m data)",
  "integration: needs Redis or Docker (run with -m integration)",
]
