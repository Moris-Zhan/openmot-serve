# Optional S3 storage backend, verified only against the pinned RustFS image.
# Credentials must come from the environment; no default keys are committed.
x-s3-env: &s3-env
  OPENMOT_STORAGE_BACKEND: s3
  OPENMOT_S3_ENDPOINT_URL: http://s3:9000
  OPENMOT_S3_BUCKET: ${OPENMOT_S3_BUCKET:-openmot}
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}

services:
  s3:
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    ports:
      - "127.0.0.1:${OPENMOT_S3_PORT:-9000}:9000"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    environment:
      <<: *s3-env
    volumes:
      - api-scratch:/data/storage
    depends_on:
      s3:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    environment:
      <<: *s3-env
    volumes:
      - worker-scratch:/data/storage
    depends_on:
      s3:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  s3-data:
  api-scratch:
  worker-scratch:
