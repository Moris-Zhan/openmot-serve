# Run the worker on a TensorRT engine. Stack it on the base file and the weights volume file:
#   docker compose -f docker-compose.yml -f docker-compose.weights-volume.yml -f docker-compose.tensorrt.yml up -d
# The engines live in an existing named volume (docker volume create openmot-engines).
# The precision defaults to fp16; set OPENMOT_PRECISION=int8 to serve an INT8 engine. The engine's sidecar must
# record the same precision, otherwise the worker refuses to start.
services:
  worker:
    build:
      target: tensorrt
    image: openmot-worker:tensorrt
    environment:
      OPENMOT_BACKEND: tensorrt
      OPENMOT_PRECISION: ${OPENMOT_PRECISION:-fp16}
      OPENMOT_ENGINE: /models/engines/${OPENMOT_ENGINE_FILE:?set OPENMOT_ENGINE_FILE to the engine file name inside the engines volume}
    volumes:
      - type: volume
        source: engines
        target: /models/engines
        read_only: true

  engine-builder:
    profiles: ["tools"]
    image: openmot-worker:tensorrt
    entrypoint: python
    volumes:
      - type: volume
        source: engines
        target: /models/engines
      - type: volume
        source: weights
        target: /models/yolox_x.pth
        read_only: true
        volume:
          subpath: yolox_x.pth
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  engines:
    external: true
    name: ${OPENMOT_ENGINES_VOLUME:-openmot-engines}
