name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.8.4
      - name: Lint
        run: ruff check .

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the CPU build of PyTorch
        run: pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install the package
        run: pip install -e ".[dev,service]"
      - name: Install kubectl, kustomize and kubeconform
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o kubectl https://dl.k8s.io/release/v1.31.4/bin/linux/amd64/kubectl
          echo "298e19e9c6c17199011404278f0ff8168a7eca4217edad9097af577023a5620f  kubectl" | sha256sum --check
          curl -fsSL -o kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz
          echo "6703a3a70a0c47cf0b37694030b54f1175a9dfeb17b3818b623ed58b9dbc2a77  kustomize.tar.gz" | sha256sum --check
          curl -fsSL -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  kubeconform.tar.gz" | sha256sum --check
          tar -xzf kustomize.tar.gz kustomize
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install -m 0755 kubectl kustomize kubeconform /usr/local/bin/
      - name: Check the manifest tools
        run: |
          kubectl version --client
          kustomize version
          kubeconform -v
      - name: Run the default tests
        run: python -m pytest

  build-api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-buildx-action@v3.8.0
      - name: Build the api image
        uses: docker/build-push-action@v6.10.0
        with:
          context: .
          file: deploy/docker/api.Dockerfile
          push: false
          load: true
          tags: openmot-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Smoke test the api image
        run: docker run --rm openmot-api:ci python -c "import app.run"

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, build-api]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Lowercase the repository owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3.8.0
      - uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the api image
        uses: docker/build-push-action@v6.10.0
        with:
          context: .
          file: deploy/docker/api.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/openmot-api:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.name }}/openmot-api:main
          cache-from: type=gha,scope=api
      - name: Build and push the worker image
        uses: docker/build-push-action@v6.10.0
        with:
          context: .
          file: deploy/docker/worker.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/openmot-worker:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.name }}/openmot-worker:main
